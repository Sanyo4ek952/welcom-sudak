name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  e2e:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: welcom_sudak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/welcom_sudak
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      ADMIN_PASSWORD: admin123
      ADMIN_SESSION_TOKEN: e2e-admin-session-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm install
      - name: Prisma setup
        run: npm run prisma:generate && npx prisma db push && npm run prisma:seed
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run e2e
        run: npm run test:e2e
      - name: Upload playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
