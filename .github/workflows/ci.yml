name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: welcom_sudak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/welcom_sudak
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      ADMIN_PASSWORD: admin123
      ADMIN_SESSION_TOKEN: ci-admin-session-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm install
      - name: Prisma generate
        run: npm run prisma:generate
      - name: Prisma push schema
        run: npx prisma db push
      - name: Prisma seed
        run: npm run prisma:seed
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm run test:ci
      - name: Build
        run: npm run build
